<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="The guard: Claude wants to run a command, jevmem checks it against your saved rules, and Claude Code asks you first."><title>The guard: Claude wants to run a command, jevmem checks it against your saved rules, and Claude Code asks you first.</title><rect x="0" y="0" width="1000" height="2" fill="#ecebe6"/><text x="0" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f08a4b" text-anchor="start" letter-spacing="1">01</text><text x="30" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9a9ca1" text-anchor="start" letter-spacing="1.5">THE CALL</text><rect x="0" y="46" width="300" height="1" fill="#3a3a3e"/><text x="0" y="82" font-family="Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="23" font-weight="400" fill="#ecebe6" text-anchor="start" >Claude wants to run</text><path d="M320.0 144 L330.0 154 L320.0 164" fill="none" stroke="#f08a4b" stroke-width="2.5" stroke-linejoin="miter"/><text x="350" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f08a4b" text-anchor="start" letter-spacing="1">02</text><text x="380" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9a9ca1" text-anchor="start" letter-spacing="1.5">THE CHECK</text><rect x="350" y="46" width="300" height="1" fill="#3a3a3e"/><text x="350" y="82" font-family="Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="23" font-weight="400" fill="#ecebe6" text-anchor="start" >jevmem checks your rules</text><path d="M670.0 144 L680.0 154 L670.0 164" fill="none" stroke="#f08a4b" stroke-width="2.5" stroke-linejoin="miter"/><text x="700" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f08a4b" text-anchor="start" letter-spacing="1">03</text><text x="730" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9a9ca1" text-anchor="start" letter-spacing="1.5">THE ASK</text><rect x="700" y="46" width="300" height="1" fill="#3a3a3e"/><text x="700" y="82" font-family="Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="23" font-weight="400" fill="#ecebe6" text-anchor="start" >Claude Code asks you</text><rect x="0" y="112" width="300" height="84" fill="#1d1d1f"/><rect x="0" y="112" width="3" height="84" fill="#ecebe6"/><text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#ecebe6" text-anchor="start" >$ git add -A &amp;&amp;</text><text x="20" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#ecebe6" text-anchor="start" >  git commit -m "wip"</text><text x="0" y="232" font-family="Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="17" font-weight="400" fill="#9a9ca1" text-anchor="start" font-style="italic">This would also commit .env</text><text x="350" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9a9ca1" text-anchor="start" letter-spacing="0.5">JEVMEM.md</text><text x="350" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#9a9ca1" text-anchor="start" >[constraint]</text><text x="350" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#f08a4b" text-anchor="start" >Never commit .env files.</text><rect x="475" y="186" width="39" height="2" fill="#f08a4b"/><text x="350" y="232" font-family="Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="17" font-weight="400" fill="#9a9ca1" text-anchor="start" font-style="italic">Jev: this call may break it</text><rect x="700.5" y="112.5" width="299" height="83" fill="none" stroke="#ecebe6" stroke-width="1"/><text x="716" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#f08a4b" text-anchor="start" >jevmem: this may break a saved rule</text><rect x="716.5" y="150.5" width="91" height="31" fill="none" stroke="#9a9ca1" stroke-width="1"/><text x="762" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ecebe6" text-anchor="middle" >Allow</text><rect x="820" y="150" width="92" height="32" fill="#ecebe6"/><text x="866" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#121212" text-anchor="middle" >Deny</text><text x="700" y="232" font-family="Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="17" font-weight="400" fill="#9a9ca1" text-anchor="start" font-style="italic">before it runs. You decide.</text><rect x="0" y="256" width="1000" height="1" fill="#3a3a3e"/><text x="0" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ecebe6" text-anchor="start" letter-spacing="1.5">THE GUARD</text><text x="96" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9a9ca1" text-anchor="start" >checks commands and file edits against your saved rules. A backstop, not a sandbox.</text></svg>