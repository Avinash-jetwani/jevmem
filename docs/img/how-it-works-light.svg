<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="How jevmem works: you say it, Jev decides, jevmem writes one line to JEVMEM.md, and next session Claude gets the lines that matter." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How jevmem works: you say it, Jev decides, jevmem writes one line to JEVMEM.md, and next session Claude gets the lines that matter.</title><rect x="10" y="20" width="218" height="220" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="42" cy="56" r="15" fill="#E0692A"/><text x="42" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="66" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >You say it</text><path d="M240.0 119.0 L253.0 130.0 L240.0 141.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="20" width="218" height="220" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="296" cy="56" r="15" fill="#E0692A"/><text x="296" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="320" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Jev decides</text><path d="M494.0 119.0 L507.0 130.0 L494.0 141.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="518" y="20" width="218" height="220" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="550" cy="56" r="15" fill="#E0692A"/><text x="550" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="574" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >jevmem writes it</text><path d="M748.0 119.0 L761.0 130.0 L748.0 141.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="772" y="20" width="218" height="220" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="804" cy="56" r="15" fill="#E0692A"/><text x="804" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="828" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Next session</text><rect x="30" y="100" width="178" height="64" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >We use Postgres.</text><text x="32" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start" >in a Claude Code chat</text><text x="286" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >Worth keeping?</text><text x="286" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E0692A" text-anchor="start" >Yes: a decision.</text><text x="286" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start" >about 0.3 s, in the</text><text x="286" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start" >background</text><text x="540" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#59636e" text-anchor="start" >JEVMEM.md</text><text x="540" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#8c9097" text-anchor="start" >We use SQLite.</text><line x1="538" y1="134" x2="678" y2="134" stroke="#8c9097" stroke-width="2"/><text x="540" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" >We use Postgres.</text><text x="540" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start" >one line, in your repo</text><text x="794" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >Claude gets the</text><text x="794" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >lines that matter</text><text x="794" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >for your prompt.</text><text x="794" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start" >automatically</text><text x="500.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#59636e" text-anchor="middle" >Change your mind, and the old line is crossed out. Your team gets the file through git.</text></svg>