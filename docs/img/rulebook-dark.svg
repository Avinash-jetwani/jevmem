<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="jevmem: you chat as usual in Claude Code, Cursor or Codex; decisions, rules and failed approaches go to JEVMEM.md in your repo, shared through git; your agents read it; and the guard checks Claude's commands and edits against the rules before they run."><title>jevmem: you chat as usual in Claude Code, Cursor or Codex; decisions, rules and failed approaches go to JEVMEM.md in your repo, shared through git; your agents read it; and the guard checks Claude's commands and edits against the rules before they run.</title><rect x="10" y="20" width="250" height="250" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><circle cx="42" cy="56" r="15" fill="#F08A4B"/><text x="42" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151b23" text-anchor="middle" >1</text><text x="66" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >You chat as usual</text><rect x="28" y="92" width="214" height="44" rx="14" fill="#0d1117" stroke="#3d444d"/><text x="44" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start" >We use pnpm, not npm.</text><rect x="28" y="146" width="214" height="44" rx="14" fill="#0d1117" stroke="#3d444d"/><text x="44" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start" >Don't hand-edit migrations.</text><text x="30" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >in Claude Code, Cursor</text><text x="30" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >or Codex</text><path d="M274 134 L287 145 L274 156" fill="none" stroke="#F08A4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="20" width="400" height="250" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><circle cx="332" cy="56" r="15" fill="#F08A4B"/><text x="332" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151b23" text-anchor="middle" >2</text><text x="356" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start" >JEVMEM.md</text><text x="356" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" >one file in your repo, shared through git</text><text x="320" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F08A4B" text-anchor="start" >[decision]</text><text x="412.4" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >We use pnpm, not npm.</text><text x="320" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F08A4B" text-anchor="start" >[constraint]</text><text x="429.2" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >Don't hand-edit migrations.</text><text x="320" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F08A4B" text-anchor="start" >[dead-end]</text><text x="412.4" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >In-memory cache broke the</text><text x="412.4" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >build: keep Redis.</text><path d="M714 134 L727 145 L714 156" fill="none" stroke="#F08A4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="740" y="20" width="250" height="250" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><circle cx="772" cy="56" r="15" fill="#F08A4B"/><text x="772" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151b23" text-anchor="middle" >3</text><text x="796" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Your agents read it</text><text x="760" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" >Claude Code</text><text x="760" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" >every prompt</text><text x="760" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" >Cursor</text><text x="760" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" >the jevmem plugin</text><text x="760" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#