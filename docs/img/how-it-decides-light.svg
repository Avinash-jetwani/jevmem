<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 290" width="1230" height="290" role="img" aria-label="How jevmem decides: scrub secrets, ask Jev typed questions, apply thresholds in code (a restated line is not saved again), write one line, supersede the old line, and mark a rule for every change always-on."><title>How jevmem decides: scrub secrets, ask Jev typed questions, apply thresholds in code (a restated line is not saved again), write one line, supersede the old line, and mark a rule for every change always-on.</title><rect x="10" y="20" width="180" height="250" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="40" cy="54" r="15" fill="#E0692A"/><text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="64" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" >Scrub</text><text x="28" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >Secrets, emails and</text><text x="28" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >card-shaped numbers</text><text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >are removed before</text><text x="28" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >the turn leaves</text><text x="28" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >your machine.</text><path d="M197.0 134.0 L210.0 145.0 L197.0 156.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="20" width="180" height="250" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="246" cy="54" r="15" fill="#E0692A"/><text x="246" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="270" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" >Ask Jev</text><text x="234" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >A decision? A rule?</text><text x="234" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >A bug? Small talk?</text><text x="234" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >An injection? Said</text><text x="234" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >already? A rule for</text><text x="234" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >every change? Which</text><text x="234" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >saved line does it</text><text x="234" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >change?</text><path d="M403.0 134.0 L416.0 145.0 L403.0 156.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="422" y="20" width="180" height="250" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="452" cy="54" r="15" fill="#E0692A"/><text x="452" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="476" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" >Thresholds</text><text x="440" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >Plain rules over the</text><text x="440" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >probabilities decide</text><text x="440" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >save or skip, in</text><text x="440" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >jevmem.config.json,</text><text x="440" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >not in a prompt.</text><text x="440" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe 