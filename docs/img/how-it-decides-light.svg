-anchor="start" >with its reason.</text><path d="M815.0 134.0 L828.0 145.0 L815.0 156.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="834" y="20" width="180" height="250" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="864" cy="54" r="15" fill="#E0692A"/><text x="864" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="888" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" >Supersede</text><text x="852" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >The old line is</text><text x="852" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >tagged [superseded]</text><text x="852" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >and stays in the</text><text x="852" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start" >file, for history.</text><path d="M1021.0 134.0 L1034.0 145.0 L1021.0 156.0" fill="none" stroke="#E0692A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1040" y="20" width="180" height="250" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="1070" cy="54" r="15" fill="#E0692A"/><text x="1070" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#