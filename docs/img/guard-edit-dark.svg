<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="The guard on an edit: Claude wants to edit a generated migration, jevmem finds the team's rule in JEVMEM.md, and Claude Code asks you before the edit runs."><title>The guard on an edit: Claude wants to edit a generated migration, jevmem finds the team's rule in JEVMEM.md, and Claude Code asks you before the edit runs.</title><rect x="10" y="20" width="300" height="200" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><circle cx="42" cy="56" r="15" fill="#F08A4B"/><text x="42" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151b23" text-anchor="middle" >1</text><text x="66" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Claude wants to edit</text><path d="M324.0 109.0 L337.0 120.0 L324.0 131.0" fill="none" stroke="#F08A4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="20" width="300" height="200" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><circle cx="382" cy="56" r="15" fill="#F08A4B"/><text x="382" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151b23" text-anchor="middle" >2</text><text x="406" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >jevmem checks it</text><path d="M664.0 109.0 L677.0 120.0 L664.0 131.0" fill="none" stroke="#F08A4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="690" y="20" width="300" height="200" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><circle cx="722" cy="56" r="15" fill="#F08A4B"/><text x="722" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151b23" text-anchor="middle" >3</text><text x="746" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Claude Code asks you</text><rect x="30" y="96" width="260" height="78" rx="10" fill="#15161a"/><text x="46" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f6f5f1">Edit db/migrations/</text><text x="46" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f6f5f1">  0042_users.sql</text><text x="32" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >three weeks later, a fresh session</text><text x="372" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >Your team's rule, in JEVMEM.md:</text><text x="372" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F08A4B" text-anchor="start" >Don't hand-edit migrations.</text><text x="372" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >Jev: this may break it</text><text x="712" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >before the edit runs</text><rect x="712" y="136" width="100" height="42" rx="9" fill="#262c36"/><text x="762" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle" >Allow</text><rect x="824" y="136" width="100" height="42" rx="9" fill="#e6edf3"/><text x="874" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#151b23" text-anchor="middle" >Deny</text><text x="712" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start" >You decide.</text></svg>