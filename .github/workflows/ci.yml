name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # Every measured number in README, DEMO, SECURITY, the newest CHANGELOG entry, package.json and the CLI help
      # must trace to a results file listed in results/CURRENT.json.
      - run: node scripts/check-claims.mjs
