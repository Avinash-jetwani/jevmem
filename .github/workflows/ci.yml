name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tags too: test/old-cli-launcher.test.ts builds the v0.5.7 CLI and plugin from their tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # pnpm 11 itself needs Node >= 22.13, so install, build and lint run on Node 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      # Tests, the built CLI and check-claims then run on the matrix Node version (what users run jevmem on).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # One Linux leg also builds the Dockerfile (the image MCP directories inspect) and asks it for tools/list;
      # test/dockerfile.test.ts skips that while the version it installs is not on npm yet (a release's own commit).
      - run: node node_modules/vitest/vitest.mjs run
        env:
          JEVMEM_DOCKER: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 && '1' || '' }}
      - run: node dist/cli.js --version && node dist/cli.js --help > /dev/null
      # Every measured number in README, docs/, the docs site's pages (site/, llms.txt), DEMO, SECURITY, the newest
      # CHANGELOG entry, package.json and the CLI help must trace to a results file listed in results/CURRENT.json.
      - run: node scripts/check-claims.mjs
      # Claude Code updates an installed plugin only when plugin.json "version" changes: it must match package.json.
      - run: node scripts/check-versions.mjs
      # The plugin in plugin/ ships no code: no file over 256 KiB, no dist/, nothing minified.
      - run: node scripts/check-plugin.mjs
