name: release

# Publishes jevmem to npm when a version tag (v1.2.3) is pushed, with npm provenance.
#
# Off until you switch it on: the publish job runs only when the repository variable NPM_PUBLISH is "true"
# (Settings → Secrets and variables → Actions → Variables). The verify job runs on every version tag either way.
#
# Authentication, in order:
#   1. npm trusted publishing (OIDC): configure a trusted publisher for this repository and this workflow file
#      (release.yml) on npmjs.com. No secret is needed; npm attaches provenance automatically.
#   2. Fallback: an npm automation token in the repository secret NPM_TOKEN (used only if OIDC is not configured;
#      --provenance still signs the build).
# The `npm` environment lets you add required reviewers before anything is published.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/check-claims.mjs
      - name: Tag, package.json, plugin.json and the marketplace entry name the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8")).version;
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8")).plugins.find((p) => p.name === "jevmem").source.version;
            const all = { tag, "package.json": pkg, "plugin.json": plugin, "marketplace.json": market };
            if (new Set(Object.values(all)).size !== 1) { console.error("version mismatch:", all); process.exit(1); }
            console.log("version", tag);
          ' "$tag"
      - name: The packed tarball runs without node_modules (what npm users and the Claude Code plugin get)
        run: |
          mkdir -p /tmp/pack /tmp/pkg
          npm pack --pack-destination /tmp/pack
          tar xzf /tmp/pack/jevmem-*.tgz -C /tmp/pkg
          node /tmp/pkg/package/dist/cli.js --version

  publish:
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
