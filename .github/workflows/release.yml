name: release

# Publishes jevmem to npm when a version tag (v1.2.3) is pushed, with npm provenance.
#
# Off until you switch it on: the publish job runs only when the repository variable NPM_PUBLISH is "true"
# (Settings → Secrets and variables → Actions → Variables). The verify job runs on every version tag either way.
#
# Authentication, in order:
#   1. npm trusted publishing (OIDC): configure a trusted publisher for this repository and this workflow file
#      (release.yml) on npmjs.com. No secret is needed; npm attaches provenance automatically.
#   2. Fallback: an npm automation token in the repository secret NPM_TOKEN (used only if OIDC is not configured;
#      --provenance still signs the build).
# The `npm` environment lets you add required reviewers before anything is published.
#
# After npm publish succeeds, the `directory` job fast-forwards the `directory` branch to the tagged commit. The
# Claude plugin directory follows that branch, so a plugin version reaches it only once its CLI is on npm. The push
# has no --force: if the tag is not ahead of `directory`, the job fails instead.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/check-claims.mjs
      - name: The tag, package.json and plugin/.claude-plugin/plugin.json name the same version; plugin/ ships no code
        run: |
          node scripts/check-versions.mjs
          node scripts/check-plugin.mjs
          test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')" || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - name: The packed tarball runs without node_modules (what npm users and the Claude Code plugin get)
        run: |
          mkdir -p /tmp/pack /tmp/pkg
          npm pack --pack-destination /tmp/pack
          tar xzf /tmp/pack/jevmem-*.tgz -C /tmp/pkg
          node /tmp/pkg/package/dist/cli.js --version

  publish:
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  directory:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the directory branch (fast-forward only)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward the directory branch to the released commit
        run: |
          set -eu
          git fetch origin main directory
          # Only commits already on main are released to the directory.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/directory; then
            echo "directory already contains $GITHUB_SHA"; exit 0
          fi
          git merge-base --is-ancestor origin/directory "$GITHUB_SHA" || { echo "directory is not an ancestor of $GITHUB_SHA: not a fast-forward"; exit 1; }
          git push origin "$GITHUB_SHA:refs/heads/directory"
          echo "directory -> $GITHUB_SHA ($GITHUB_REF_NAME)"
