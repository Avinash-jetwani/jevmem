name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      multiple: true
      options:
        - Claude Code
        - Cursor
        - Codex
        - Claude Desktop
        - Other
